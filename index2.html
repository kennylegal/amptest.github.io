<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - AnalytiCS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 60px 40px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            text-align: center;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .benefits {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: left;
        }

        .benefits h3 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            padding: 8px 0;
        }

        .benefit-item::before {
            content: "✓";
            color: #667eea;
            font-weight: bold;
            margin-right: 12px;
            font-size: 18px;
        }

        .benefit-item span {
            color: #555;
        }

        .cta-container {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .button {
            padding: 14px 30px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .confirmation-email {
            background: #e8f4f8;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 30px 0;
            border-radius: 5px;
            text-align: left;
        }

        .confirmation-email strong {
            color: #667eea;
        }

        .confirmation-email p {
            color: #555;
            margin: 5px 0;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
        }

        .social-links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        
        <h1>Welcome to AnalytiCS!</h1>
        
        <p class="subtitle">
            Thank you for signing up. You're all set to start tracking and analyzing user behavior in real-time.
        </p>
    </div>

    <script type="text/javascript">
            (function(window, document) {
            window.amplitude = window.amplitude || { _q: [], _iq: {} };
            var as = document.createElement('script');
            as.type = 'text/javascript';
            as.async = true;
            as.src = 'https://cdn.amplitude.com/libs/amplitude-8.17.0-min.gz.js';
            as.onload = function() {
                if (window.amplitude.isInitialized) {
                    return;
                }
                window.amplitude.init('e37d0a7e40027b9b901aa92f70a31085', null, {
                    logLevel: 'INFO'
                });
            };
            var s = document.getElementsByTagName('script')[0];
            s.parentNode.insertBefore(as, s);
        })(window, document);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Track sign-up completion
            if (window.amplitude && window.amplitude.logEvent) {
                window.amplitude.logEvent('SignUp_Completed', {
                    page: 'Thank You Page',
                    timestamp: new Date().toISOString()
                });
            }
        });
    </script>
</body>
</html>
